<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Image - Ephemeral</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(-45deg, #1e1e2e, #2a2a3e, #1a1a2e, #16213e);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
      overflow: hidden;
    }

    /* Prevent printing */
    @media print {
      body {
        display: none !important;
      }
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas styling */
    canvas {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 60px rgba(102, 126, 234, 0.2);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      transition: filter 0.3s ease, transform 0.2s ease;
      animation: slideUp 0.6s ease-out;
    }

    canvas.blur-on-blur {
      filter: blur(15px) brightness(0.5);
      transform: scale(0.98);
    }

    /* Overlay to block interaction and right-click */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      cursor: not-allowed;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Enhanced Watermark */
    #watermark {
      position: fixed;
      top: 20px;
      right: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      line-height: 1.8;
      text-align: right;
      z-index: 51;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Courier New', monospace;
      background: rgba(20, 20, 35, 0.8);
      padding: 16px 20px;
      border-radius: 10px;
      border: 2px solid rgba(102, 126, 234, 0.4);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.8s ease-out;
    }

    #watermark div {
      margin-bottom: 6px;
    }

    #watermark div:first-child {
      font-weight: bold;
      color: #667eea;
      font-size: 14px;
      margin-bottom: 8px;
    }

    #watermark div:last-child {
      margin-bottom: 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
    }

    /* Enhanced Timer */
    #timer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 35, 0.85);
      color: #fff;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 14px;
      z-index: 51;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      border: 2px solid rgba(102, 126, 234, 0.5);
      font-weight: 600;
      letter-spacing: 0.5px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.2);
      animation: slideUp 0.6s ease-out 0.2s both;
    }

    #timer.warning {
      background: rgba(220, 53, 69, 0.85);
      border-color: rgba(255, 107, 107, 1);
      animation: pulse 1s infinite;
    }

    /* Expired message */
    .expired {
      background: rgba(20, 20, 35, 0.95);
      backdrop-filter: blur(20px);
      padding: 80px 50px;
      color: white;
      text-align: center;
      border-radius: 20px;
      max-width: 550px;
      margin: auto;
      z-index: 60;
      border: 2px solid rgba(102, 126, 234, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.6s ease-out;
    }

    .expired h1 {
      font-size: 42px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .expired p {
      font-size: 16px;
      opacity: 0.85;
      margin-bottom: 32px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.8);
    }

    .expired a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }

    .expired a:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
    }

    /* Protection Indicator */
    #protectionIndicator {
      position: fixed;
      top: 20px;
      right: 20px;
      color: rgba(100, 200, 100, 0.9);
      font-size: 13px;
      font-weight: 600;
      z-index: 49;
      pointer-events: none;
      user-select: none;
      font-family: 'Courier New', monospace;
      background: rgba(20, 20, 35, 0.6);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(100, 200, 100, 0.3);
      animation: fadeIn 0.8s ease-out;
    }

    /* Close button */
    #closeBtn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: all 0.3s;
      font-weight: bold;
      padding: 0;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
      animation: slideUp 0.6s ease-out;
    }

    #closeBtn:hover {
      transform: scale(1.15);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
    }

    #closeBtn:active {
      transform: scale(0.9);
    }

    /* Warning banner */
    #warningBanner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(220, 53, 69, 0.95);
      color: white;
      padding: 20px 40px;
      border-radius: 12px;
      font-weight: 600;
      z-index: 200;
      pointer-events: none;
      box-shadow: 0 15px 40px rgba(220, 53, 69, 0.3);
      max-width: 400px;
      text-align: center;
      border: 2px solid rgba(255, 107, 107, 1);
      animation: slideUp 0.4s ease-out;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>
    <div id="overlay"></div>
    <div id="protectionIndicator">🔒 Protected</div>
    <button id="closeBtn" title="Close image (auto-deletes if single-view)">✕</button>
    <div id="watermark"></div>
    <div id="timer"></div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
